<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0f"/>
  
  <!-- T-shaped Tetromino (Purple) -->
  <!-- Top horizontal bar -->
  <rect x="12" y="16" width="12" height="12" rx="2" fill="#c084fc"/>
  <rect x="24" y="16" width="12" height="12" rx="2" fill="#c084fc"/>
  <rect x="36" y="16" width="12" height="12" rx="2" fill="#c084fc"/>
  
  <!-- Center vertical piece -->
  <rect x="24" y="28" width="12" height="12" rx="2" fill="#c084fc"/>
  
  <!-- L-shaped Tetromino (Orange) -->
  <rect x="12" y="40" width="12" height="12" rx="2" fill="#fb923c"/>
  <rect x="24" y="40" width="12" height="12" rx="2" fill="#fb923c"/>
  <rect x="36" y="40" width="12" height="12" rx="2" fill="#fb923c"/>
  
  <!-- Small highlight on blocks for depth -->
  <rect x="14" y="18" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="26" y="18" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="38" y="18" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="26" y="30" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="14" y="42" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="26" y="42" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
  <rect x="38" y="42" width="8" height="2" rx="1" fill="#ffffff" opacity="0.3"/>
</svg>
